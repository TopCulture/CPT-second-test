<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E6B62">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pharm plan">
<title>Pharmacology test plan</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F5;--surf:#FFFFFF;--ink:#1B2A2F;--mute:#5B6B70;--line:#D3DDDA;--acc:#0E6B62;--acc-ink:#FFFFFF;--late:#B4620F;--late-bg:#FBF0E1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1719;--surf:#152226;--ink:#E4EEEC;--mute:#95A9AC;--line:#28393D;--acc:#4CC2B3;--acc-ink:#062521;--late:#E5B062;--late-bg:#2A2216}}
:root[data-theme="dark"]{--bg:#0E1719;--surf:#152226;--ink:#E4EEEC;--mute:#95A9AC;--line:#28393D;--acc:#4CC2B3;--acc-ink:#062521;--late:#E5B062;--late-bg:#2A2216}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:620px;margin:0 auto;padding:20px 16px 48px}
.cd{margin:0 0 8px;color:var(--mute);font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.prog{margin:6px 0 0;font-size:14px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:4px 16px 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:66px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:13px;line-height:1.25;text-align:center;cursor:pointer}
.chip span,.chip b{display:block}
.chip b{font-weight:600;font-size:15px}
.chip.part{border-color:var(--acc)}
.chip.late{border-color:var(--late)}
.chip.done{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.now{box-shadow:0 3px 0 -1px var(--ink)}
.chip.sel{outline:2.5px solid var(--ink);outline-offset:2px}
h1{margin:16px 0 2px;font-size:clamp(30px,8vw,42px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.date{margin:0 0 6px;color:var(--mute)}
.note{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--acc);background:var(--surf);font-size:15px}
ul{list-style:none;margin:14px 0 0;padding:0}
li{border-top:1px solid var(--line)}
li:last-child{border-bottom:1px solid var(--line)}
.row{position:relative;display:flex;gap:14px;align-items:flex-start;padding:14px 2px;min-height:48px;cursor:pointer}
.row input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:0 0 26px;height:26px;margin-top:1px;border:2px solid var(--mute);border-radius:7px;display:grid;place-items:center;transition:background .12s,border-color .12s}
.row input:checked+.box{background:var(--acc);border-color:var(--acc)}
.row input:checked+.box::after{content:"";width:6px;height:12px;border:solid var(--acc-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row input:focus-visible+.box{outline:3px solid var(--ink);outline-offset:2px}
.row input:checked~.txt{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.r .txt{color:var(--mute)}
.skim{margin-left:8px;padding:1px 8px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-style:normal;color:var(--mute);white-space:nowrap}
.from{display:block;font-size:13px;color:var(--mute)}
.late-box{margin-top:26px;padding:12px 14px 4px;border-left:4px solid var(--late);background:var(--late-bg);border-radius:0 8px 8px 0}
.late-box h2{margin:0 0 2px;font-size:18px}
.late-box p{margin:0 0 6px;font-size:14px;color:var(--mute)}
.late-box ul{margin-top:8px}
.late-box li{border-color:var(--line);border-color:color-mix(in srgb,var(--late) 30%,transparent)}
.late-box .row{padding:11px 2px}
footer{margin-top:28px;font-size:14px;color:var(--mute)}
footer p{margin:0 0 6px}
@media (prefers-reduced-motion:reduce){.box{transition:none}}
.sync{margin:0 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
.sync p{margin:0 0 8px}
.sync a{color:var(--acc)}
.sync input{width:100%;margin:2px 0 8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.sbtn{padding:8px 14px;border:1.5px solid var(--acc);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.view .row{cursor:default}
.view footer{display:none}
.sync input[readonly]{text-overflow:ellipsis}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var K='pharm-plan-v1',TEST=[2026,9,12];
var D=[
['2026-09-30','Cholinergic',[['t','Cholinergic transmission: biochemistry & physiology'],['t','Cholinomimetics & anticholinergics'],['s','Antispasmodics & spasmolytics']]],
['2026-10-01','Adrenergic',[['t','Adrenergic transmission: biochemistry & physiology'],['t','Adrenoceptor agonists & sympathomimetics'],['t','Adrenoceptor antagonists']]],
['2026-10-02','Neuromuscular junction and angiotensin',[['t','Interneuronal blockers & myasthenia gravis drugs'],['t','Skeletal muscle relaxants'],['t','Vasoactive peptides I: angiotensin, kinins']],'Leave the analgesics and antipyretics part of the muscle relaxants topic for Sunday.'],
['2026-10-03','Vasoactive mediators',[['t','Vasopressin & natriuretic peptides'],['t','Nitric oxide'],['s','Vasoactive peptides III: endothelins, VIP, substance P, adrenomedullin, NPY'],['t','Eicosanoids']]],
['2026-10-04','Analgesics and the start of the CNS',[['t','Non-narcotic analgesics, salicylates & migraine drugs, plus the analgesics/antipyretics part from Friday'],['s','Ergot alkaloids'],['s','Cannabinoids'],['t','Introduction to CNS pharmacology & drug entry into the CNS'],['t','Dopamine & dopamine antagonists']]],
['2026-10-05','Psychiatry',[['t','Mood disorders: pathophysiology'],['t','Antipsychotics: typical & atypical'],['t','Antidepressants']]],
['2026-10-06','Sedatives and mood stabilizers',[['t','Lithium, anxiolytics & other mood stabilizers'],['t','Barbiturates & non-barbiturates'],['s','GABA receptor agonists'],['t','Melatonin agonists, sedative-hypnotics & benzodiazepines']]],
['2026-10-07','Epilepsy',[['t','Antiseizure drugs & epilepsy classification'],['t','Principles of epilepsy treatment'],['t','Antiseizure drugs in status epilepticus & special situations']]],
['2026-10-08','Movement, memory and anaesthesia',[['t','Parkinsonism & other movement disorders'],['t','Drug treatment of dementia'],['t','General anaesthetics']]],
['2026-10-09','Loose ends',[['t','Local anaesthetics'],['t','Drug dependence, alcohol use & misuse'],['t','CNS stimulants & depressants'],['t','Purines & adenosine']]],
['2026-10-10','Revision 1',[['x','Catch-up hour: anything you skipped'],['x','Revise cholinergic, adrenergic, mediators & analgesics from your one-pagers'],['x','Timed practice questions in the test format']]],
['2026-10-11','Revision 2',[['x','Revise the CNS drugs from your one-pagers'],['x','Quick recall: histamine, serotonin, opioids'],['x','Build a one-sheet must-know list: drugs of choice, adverse effects, contraindications'],['x','Finish early and sleep']]],
['2026-10-12','Test day',[['x','Skim the must-know sheet only. No new material.']]]
];
var PRE=['Histamine receptors & antagonists','Serotonin & serotonin receptor antagonists','Opioid agonists & antagonists'];
var DAYS=D.map(function(x,i){var a=[];
 if(i>0&&i<10)a.push({id:i+'.a',t:'Recall yesterday\u2019s topics from your one-pagers (15 min)',k:'r'});
 x[2].forEach(function(r,j){a.push({id:i+'.'+j,t:r[1],k:r[0]});});
 if(i<12)a.push({id:i+'.z',t:'Other subjects (45\u201360 min), Haematology first',k:'r'});
 return{d:x[0],th:x[1],note:x[3]||'',items:a};});
var S={},ok=true;
try{S=JSON.parse(localStorage.getItem(K)||'null')||{};}catch(e){ok=false;}
if(!Object.keys(S).length)S={p0:1,p1:1,p2:1};
var Q=new URLSearchParams(location.search),VID=Q.get('v')||'',VUSER=Q.get('u')||'',VIEW=!!VID,vmsg='Loading progress...',vlast=0;
var T={},G={token:'',gist:''},msg='Not connected',timer=null,busy=false,again=false,FN='pharm-plan-sync.json';
try{T=JSON.parse(localStorage.getItem(K+'-t')||'{}')||{};G=JSON.parse(localStorage.getItem(K+'-gh')||'null')||G;}catch(e){}
if(VIEW){S={};T={};}
function save(){try{localStorage.setItem(K,JSON.stringify(S));localStorage.setItem(K+'-t',JSON.stringify(T));}catch(e){ok=false;}}
function saveG(){try{localStorage.setItem(K+'-gh',JSON.stringify(G));}catch(e){}}
function gh(path,o){o=o||{};var get=!o.method;var url='https://api.github.com'+path+(get?(path.indexOf('?')<0?'?':'&')+'_='+Date.now():'');
 return fetch(url,{method:o.method||'GET',cache:'no-store',headers:{'Authorization':'Bearer '+G.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:o.body}).then(function(r){if(!r.ok)throw new Error(r.status===401?'GitHub rejected the token':'GitHub error '+r.status);return r.json();});}
function doc(){return JSON.stringify({v:1,s:S,t:T});}
function merge(rs,rt){Object.keys(rt).forEach(function(id){if((rt[id]||0)>(T[id]||0)){T[id]=rt[id];S[id]=rs[id]?1:0;}});}
function findGist(p){return gh('/gists?per_page=100&page='+p).then(function(l){var g=l.filter(function(x){return x.files&&x.files[FN];})[0];if(g)return g.id;return(l.length===100&&p<5)?findGist(p+1):null;});}
function ensureGist(){if(G.gist)return Promise.resolve(G.gist);
 return findGist(1).then(function(id){if(id)return id;var f={};f[FN]={content:doc()};return gh('/gists',{method:'POST',body:JSON.stringify({description:'Pharmacology plan sync',public:false,files:f})}).then(function(g){return g.id;});}).then(function(id){G.gist=id;saveG();return id;});}
function sync(){
 if(!G.token||VIEW)return;
 if(busy){again=true;return;}
 busy=true;msg='Syncing...';render(true);
 ensureGist().then(function(id){return gh('/gists/'+id).then(function(g){
   var f=g.files&&g.files[FN],r={};try{r=JSON.parse(f.content);}catch(e){}
   if(g.owner&&g.owner.login&&G.user!==g.owner.login){G.user=g.owner.login;saveG();}
   merge(r.s||{},r.t||{});save();
   if(f&&f.content===doc())return;
   var f2={};f2[FN]={content:doc()};
   return gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:f2})});});})
 .then(function(){msg='Synced at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});})
 .catch(function(e){var m=e&&e.message?e.message:'check your connection';if(/404/.test(m)){G.gist='';saveG();}msg='Sync failed: '+m;})
 .then(function(){busy=false;render(true);if(again){again=false;queue();}});
}
function queue(){if(!G.token)return;clearTimeout(timer);timer=setTimeout(sync,1500);}
function vload(force){
 if(!force&&Date.now()-vlast<30000)return;
 vlast=Date.now();vmsg='Loading progress...';render(true);
 var q='?_='+Date.now(),api='https://api.github.com/gists/'+encodeURIComponent(VID)+q,
  raw=VUSER?'https://gist.githubusercontent.com/'+encodeURIComponent(VUSER)+'/'+encodeURIComponent(VID)+'/raw/'+FN+q:'';
 fetch(api,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(g){return g.files[FN].content;})
 .catch(function(){if(!raw)throw 0;return fetch(raw,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();});})
 .then(function(txt){var d=JSON.parse(txt),last=0;S=d.s||{};T=d.t||{};Object.keys(T).forEach(function(k){if(T[k]>last)last=T[k];});
  vmsg=last?'Last updated '+new Date(last).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'.':'Nothing ticked yet.';})
 .catch(function(){vmsg='Could not load the progress right now. Try again in a few minutes.';})
 .then(function(){render(true);});
}
function vbanner(){return '<div class="sync"><p><b>View only.</b> '+esc(vmsg)+'</p><button class="sbtn" data-act="vrefresh">Refresh</button> <a href="'+esc(location.pathname)+'">Track your own progress</a></div>';}
function share(){if(!G.gist)return '';var L=location.origin+location.pathname+'?v='+G.gist+(G.user?'&u='+encodeURIComponent(G.user):'');
 return '<p style="margin-top:14px"><b>View-only link</b> for classmates. Anyone with it can see your ticks but cannot change them.</p><input id="shl" readonly value="'+esc(L)+'"> <button class="sbtn" data-act="copy">Copy link</button>';}
function syncUI(){
 if(VIEW)return '';
 if(G.token)return '<div class="sync"><p>'+esc(msg)+'</p><button class="sbtn" data-act="now">Sync now</button> <button class="sbtn" data-act="off">Disconnect</button>'+share()+'</div>';
 return '<div class="sync"><p><b>Sync across your devices.</b> Progress is stored in a private gist on your GitHub account. <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Pharm%20plan%20sync" target="_blank" rel="noopener">Create a token</a> with only the gist permission, then paste it here on each device.</p><input id="tok" type="password" placeholder="Paste token" autocomplete="off"> <button class="sbtn" data-act="connect">Connect</button></div>';
}
var now=new Date(),pad=function(n){return String(n).padStart(2,'0');};
var iso=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
var ti=DAYS.findIndex(function(x){return x.d===iso;});
if(ti<0)ti=iso<DAYS[0].d?0:DAYS.length-1;
var vi=ti;
var left=Math.round((Date.UTC(TEST[0],TEST[1],TEST[2])-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
var cd=left>1?'The test is in '+left+' days.':left===1?'The test is tomorrow.':left===0?'The test is today.':'The test is over.';
function dt(s,o){return new Date(s+'T12:00:00').toLocaleDateString('en-GB',o);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function isT(x){return x.k==='t'||x.k==='s';}
var total=3+DAYS.reduce(function(n,d){return n+d.items.filter(isT).length;},0);
function read(){return PRE.filter(function(_,i){return S['p'+i];}).length+DAYS.reduce(function(n,d){return n+d.items.filter(function(x){return isT(x)&&S[x.id];}).length;},0);}
function st(i){var a=DAYS[i].items,n=a.filter(function(x){return S[x.id];}).length;return n===a.length?'done':n?'part':'';}
function row(x,extra){return '<li class="'+(x.k==='r'?'r':'')+'"><label class="row"><input type="checkbox" data-id="'+x.id+'"'+(S[x.id]?' checked':'')+(VIEW?' disabled':'')+'><span class="box"></span><span class="txt">'+esc(x.t)+(x.k==='s'?'<em class="skim">skim</em>':'')+(extra||'')+'</span></label></li>';}
var app=document.getElementById('app');if(VIEW)app.className='view';
function render(keep){
 var n0=app.querySelector('.chips'),sl=n0?n0.scrollLeft:0;
 var d=DAYS[vi],r=read(),p=Math.round(r/total*100),carry=[];
 if(vi===ti)DAYS.forEach(function(dd,i){if(i<ti)dd.items.forEach(function(x){if(isT(x)&&!S[x.id])carry.push({x:x,i:i});});});
 var cb=carry.length?'<section class="late-box"><h2>Still to do from earlier days</h2><p>Do the full topics first. Skim topics only need drug names, one use and one adverse effect.</p><ul>'+carry.map(function(c){return row(c.x,'<span class="from">'+dt(DAYS[c.i].d,{weekday:'short',day:'numeric',month:'short'})+'</span>');}).join('')+'</ul></section>':'';
 var chips=DAYS.map(function(x,i){var s=st(i);return '<button class="chip '+s+' '+(i<ti&&s!=='done'?'late':'')+' '+(i===ti?'now':'')+' '+(i===vi?'sel':'')+'" data-day="'+i+'"><span>'+dt(x.d,{weekday:'short'})+'</span><b>'+dt(x.d,{day:'numeric',month:'short'})+'</b></button>';}).join('');
 app.innerHTML=(VIEW?vbanner():'')+'<p class="cd">'+cd+'</p><div class="bar" role="progressbar" aria-label="Topics read" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+r+'"><i style="width:'+p+'%"></i></div><p class="prog">'+r+' of '+total+' topics read</p>'
 +'<nav class="chips" aria-label="Days">'+chips+'</nav>'
 +'<h1>'+esc(d.th)+'</h1><p class="date">'+dt(d.d,{weekday:'long',day:'numeric',month:'long'})+(vi===ti?' (today)':'')+'</p>'+(d.note?'<p class="note">'+esc(d.note)+'</p>':'')
 +'<ul>'+d.items.map(function(x){return row(x);}).join('')+'</ul>'+cb
 +'<footer>'+syncUI()+'<p>After each topic, write a one-page summary as question-and-answer pairs. Those become your flashcards and your notes for a surprise test.</p>'+(ok?'':'<p>Ticks cannot be saved in this view, so they will be lost when you close it.</p>')+'</footer>';
 var n1=app.querySelector('.chips');if(keep&&n1)n1.scrollLeft=sl;
}
function center(){var s=app.querySelector('.chip.sel');if(s)s.scrollIntoView({inline:'center',block:'nearest'});}
app.addEventListener('change',function(e){var c=e.target,id=c.getAttribute&&c.getAttribute('data-id');if(!id)return;S[id]=c.checked?1:0;T[id]=Date.now();save();queue();render(true);var n=app.querySelector('[data-id="'+id+'"]');if(n)n.focus({preventScroll:true});});
app.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.chip');if(b){vi=+b.getAttribute('data-day');render();center();}});
app.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
 if(a==='connect'){var t=app.querySelector('#tok'),v=t?t.value.trim():'';if(!v)return;G={token:v,gist:''};saveG();sync();}
 else if(a==='now'){sync();}
 else if(a==='vrefresh'){vload(true);}
 else if(a==='copy'){var i=app.querySelector('#shl');if(i){i.select();try{navigator.clipboard.writeText(i.value);}catch(e){}b.textContent='Copied';}}
 else if(a==='off'){G={token:'',gist:''};saveG();msg='Not connected';render(true);}
});
render();center();sync();if(VIEW)vload(true);
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(VIEW)vload();else sync();}});
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
